<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>岩田先生如是说 · 原文精读与思辨室</title>
  <link rel="icon" type="image/svg+xml" href="../../chapter-one/dist/assets/favicon.svg">
  <style>
    :root {
      --bg: #111720;
      --bg-panel: #182230;
      --bg-panel-sub: #131c27;
      --paper: #1c2736;
      --ink: #e6eef7;
      --ink-dim: #9bb0c4;
      --ink-muted: #62778c;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --accent-orange: #f59e0b;
      --accent-blue: #38bdf8;
      --card-border: rgba(148, 167, 184, 0.14);
      --font-serif: "Songti SC", "SimSun", "STSong", "FangSong", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scrollbar-width: thin;
      scrollbar-color: var(--accent-blue) var(--bg);
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.8;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; color: inherit; }

    .reader-shell {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* Sidebar */
    .reader-sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--card-border);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-top {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 18px;
    }
    .nav-back-shelf {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-blue);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 14px;
      padding: 4px 8px;
      margin-left: -8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .nav-back-shelf:hover { background: rgba(56, 189, 248, 0.12); }
    .reader-book-identity h2 {
      font-family: var(--font-serif);
      font-size: 22px;
      color: #fff;
      font-weight: 600;
      margin: 4px 0 2px;
    }
    .reader-book-identity p {
      font-size: 12px;
      color: var(--ink-dim);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-family: var(--font-mono);
      display: block;
    }

    .chapter-switcher {
      margin-bottom: 16px;
    }
    .chapter-switcher label {
      display: block;
      font-size: 12px;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }
    .chapter-switcher select {
      width: 100%;
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .section-toc-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }
    .toc-item {
      text-align: left;
      background: transparent;
      border: 0;
      padding: 9px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--ink-dim);
      cursor: pointer;
      transition: all 0.15s;
    }
    .toc-item:hover {
      background: var(--bg-panel-sub);
      color: var(--ink);
    }
    .toc-item.active {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-weight: 500;
    }
    .toc-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }
    .toc-item.done .toc-num {
      background: #15803d;
      color: #fff;
      border-color: #15803d;
    }
    .toc-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-foot {
      padding-top: 18px;
      border-top: 1px solid var(--card-border);
      margin-top: 12px;
    }
    .font-resizer {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-muted);
      margin-bottom: 8px;
    }
    .btn-font {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-font:hover { color: #fff; border-color: var(--accent-blue); }
    .reading-stats {
      font-size: 12px;
      color: var(--ink-muted);
      font-family: var(--font-mono);
    }

    /* Main Stage */
    .reader-stage {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .reader-topbar {
      height: 64px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 44px;
    }
    .reader-breadcrumb {
      font-size: 13px;
      color: var(--ink-muted);
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reader-breadcrumb strong { color: var(--ink); font-weight: 500; }
    .curr-sec-title { color: #fff; }
    .read-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    /* Reading Paper */
    .reader-paper {
      max-width: 820px;
      width: 100%;
      margin: 44px auto 100px;
      padding: 0 36px;
    }
    .section-heading {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 22px;
    }
    .section-chapter-tag {
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--accent-blue);
      letter-spacing: 0.05em;
    }
    .section-main-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 3vw, 38px);
      color: #fff;
      font-weight: 600;
      line-height: 1.35;
      margin-top: 6px;
    }

    /* Paragraphs */
    .book-paragraph {
      font-size: var(--base-font-size, 18px);
      line-height: 2.05;
      color: var(--ink);
      margin-bottom: 24px;
      text-align: justify;
      text-justify: inter-ideograph;
    }

    /* Inline Contextual Widgets */
    .inline-widget {
      margin: 36px 0;
      padding: 26px 28px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--bg-panel);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .widget-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent-orange);
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .widget-lead {
      font-size: 14px;
      color: var(--ink-dim);
      margin-bottom: 20px;
      line-height: 1.7;
    }

    /* Sliders Board */
    .sliders-board {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 22px;
      background: var(--bg-panel-sub);
      padding: 18px 20px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slider-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
    .slider-val {
      font-family: var(--font-mono);
      color: var(--accent-blue);
      font-size: 15px;
    }
    .slider-track {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Situation Cards Grid */
    .situation-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .situation-card {
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--bg-panel-sub);
      transition: all 0.2s ease;
    }
    .situation-card.good {
      border-color: rgba(34, 197, 94, 0.4);
      background: rgba(34, 197, 94, 0.08);
    }
    .situation-card.warning {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
    }
    .situation-card.danger {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.08);
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .situation-card.good .card-title { color: #4ade80; }
    .situation-card.warning .card-title { color: #fbbf24; }
    .situation-card.danger .card-title { color: #f87171; }
    .situation-card p {
      font-size: 12px;
      line-height: 1.65;
      color: var(--ink-dim);
      margin: 0;
    }

    .situation-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .situation-summary.balanced {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }
    .situation-summary.unbalanced {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
    }

    /* RPN widget */
    .rpn-display-box {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 18px;
    }
    .stack-view {
      font-family: var(--font-mono);
      font-size: 16px;
      color: #4ade80;
      background: #0b1118;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .rpn-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .btn-rpn-key {
      background: var(--bg-panel);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-rpn-key:hover { border-color: var(--accent-blue); color: #fff; }
    .btn-rpn-key.op { border-color: rgba(56, 189, 248, 0.4); color: var(--accent-blue); }
    .btn-rpn-key.reset { border-color: rgba(239, 68, 68, 0.4); color: #f87171; }
    .rpn-status-text {
      font-size: 12.5px;
      color: var(--ink-dim);
    }

    /* Pipe Widget */
    .pipe-cards-flex {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .pipe-item-btn {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      padding: 14px 10px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.15s;
    }
    .pipe-item-btn:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
    .pipe-item-btn.choke {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }
    .p-name { font-size: 13px; font-weight: 500; }
    .p-load { font-size: 12px; font-family: var(--font-mono); color: var(--accent-blue); }
    .p-tip { font-size: 11px; color: var(--ink-muted); }
    .pipe-feedback-bar {
      font-size: 13px;
      color: var(--accent-blue);
      background: var(--bg-panel-sub);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    /* Programmer, Mother2 & Console Strategy Widgets */
    .mode-select-row, .choice-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .btn-mode, .choice-tab {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      color: var(--ink-dim);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-mode:hover, .choice-tab:hover {
      border-color: var(--accent-blue);
      color: #fff;
    }
    .btn-mode.selected, .choice-tab.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-blue);
      color: #fff;
      font-weight: 500;
    }

    .prog-feedback-box, .mother2-report-card, .console-report-card {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 18px;
    }
    .prog-feedback-box.iwata-way, .mother2-report-card.historical-win, .console-report-card.historical-win {
      border-color: rgba(74, 222, 128, 0.4);
      background: rgba(34, 197, 94, 0.05);
    }
    .prog-feedback-box.flawed, .mother2-report-card.delay-trap, .console-report-card.spec-trap {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.05);
    }
    .prog-feedback-box h4 {
      margin: 0 0 8px 0;
      font-size: 15px;
      font-weight: 600;
    }
    .prog-feedback-box.iwata-way h4 { color: #4ade80; }
    .prog-feedback-box.flawed h4 { color: #f87171; }
    .prog-feedback-box p, .report-desc {
      font-size: 13px;
      line-height: 1.7;
      color: var(--ink-dim);
      margin: 0;
    }

    .report-metrics {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      font-size: 13px;
      color: var(--ink-muted);
    }
    .report-metrics strong {
      color: #fff;
    }

    /* Reader Reflection */
    .section-foot {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--card-border);
    }
    .reader-reflection-box textarea {
      width: 100%;
      min-height: 110px;
      background: var(--bg-panel);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.7;
      margin-top: 8px;
    }
    .section-nav-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn-mark-done {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      border: 1px solid rgba(74, 222, 128, 0.4);
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-mark-done:hover { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
    .btn-next-sec {
      background: var(--bg-panel);
      border: 1px solid var(--card-border);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--accent-blue);
      cursor: pointer;
    }
    .btn-next-sec:hover { border-color: var(--accent-blue); }

    @media (max-width: 860px) {
      .reader-shell { grid-template-columns: 1fr; }
      .reader-sidebar { height: auto; position: static; }
      .reader-paper { padding: 0 18px; margin: 24px auto 60px; }
      .reader-topbar { padding: 0 18px; }
      .situation-grid { grid-template-columns: 1fr; }
      .pipe-cards-flex { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
const iwataCatalog = [
  {
    "id": 1,
    "title": "第一章 岩田先生成为社长之前",
    "desc": "从HP计算器、15亿负债危机到每半年的全员面谈",
    "ready": true
  },
  {
    "id": 2,
    "title": "第二章 岩田先生的领导力",
    "desc": "寻找瓶颈、出乎意料的惊喜与直言不讳的信赖",
    "ready": true
  },
  {
    "id": 3,
    "title": "第三章 岩田先生的个性",

    "ready": true
  },
  {
    "id": 4,
    "title": "第四章 岩田先生信赖的人",
    "desc": "一个创意解决多个问题、重做《地球冒险2》的决断",
    "ready": true
  },
  {
    "id": 5,
    "title": "第五章 岩田先生理想中的游戏",
    "desc": "打破既有延长线、双屏体感蓝海与扩大游戏人口",
    "ready": true
  },
  {
    "id": 6,
    "title": "第六章 谈谈岩田先生（对谈篇）",
    "desc": "宫本茂与糸井重里眼中的伙伴、素面待人与服务精神",
    "ready": true
  },
  {
    "id": 7,
    "title": "第七章 岩田先生其人（总结篇）",
    "desc": "不懂的事情绝不置之不理、以让大家快乐为目标",
    "ready": true
  }
];

const iwataChapters = {
  "1": [
    {
      "id": "part0004",
      "chapterId": 1,
      "title": "高中时代，遇到能编程的台式计算机",
      "paragraphs": [
        "高中时代，个人电脑一词尚未诞生，而那时，我遇到了“能编程的台式计算机”。上课时用它编写游戏，与邻座的同学一起玩，回想起来，那就是我与游戏和程序最初的相遇。",
        "那个台式机是惠普公司生产的，据说阿波罗—联盟测试计划的宇航员正是用它进行通信天线角度的运算。当时，计算机价格非常昂贵，刷盘子打工赚的钱只够买半个，另一半是父亲掏的腰包。",
        "我把那个台式机研究得彻彻底底。那时市面上当然还没有专门的杂志，也没有人指导，总而言之只能自己琢磨。经过反复试错，我逐步发现：“啊，原来它还能拓展出这么多用法。”",
        "如今回想起来，那个台式机真的很特别，它没有“＝”键。比方说，如果要计算1加2，得先按“1”再按“ENTER”键；接着按“2”，最后按“＋”。和日语的语法一样：“1和2相加，3和4相乘，12除去，结果得几？”按照这种逻辑输入。但单是没有“＝”键，一般人就不会想使用了吧？能灵活操作这样的工具，令当年的我格外开心。",
        "就这样，我制作了一款游戏，然后把成品寄给了惠普公司的日本代理店。听说对方十分惊讶，想不到“札幌竟然出了这么一个高中生”。放到今天，就好比任天堂收到不知从何方而来的高中生自主制作的游戏，完成度几乎达到明天就能发售的水准，肯定会让人大吃一惊。但当时，我对自己做的事情具有什么价值毫无概念（笑）。",
        "后来，大约在我埋头研究台式机两年之后，苹果公司的电脑上市了。",
        "因为有着这样一番来龙去脉，我在接触到初期的电脑后不久，就不再对它抱有幻想。电脑并不是什么都做得到的梦幻般的万能机器。换言之，电脑擅长的事情是什么，不擅长的事情是什么，对于这一点，从高中时代起我就已经了然于胸。",
        "此外，那时有个对我制作的计算机游戏兴致勃勃的朋友，他正巧就坐在我的邻座。这一点也至关重要。",
        "我那个朋友是个很有趣的家伙……怎么说呢，他能欣赏我做的东西，对我而言，他是弥足珍贵的第一位客人、第一号用户。",
        "人呢，终究需要有能赞赏自己所做的事情的人，否则就无法迈向更高的台阶。因此，高中时代与他相遇对我的人生有着非常积极的影响。"
      ],
      "widget": "rpn-calc"
    },
    {
      "id": "part0005",
      "chapterId": 1,
      "title": "大学时代，在电脑卖场遇见的伙伴们",
      "paragraphs": [

        "我记得很清楚，岩田先生在重新制作《地球冒险2》时，首先从组建起新机制入手。",
        "他宣称要在半年之内完成项目，并不是自己闷头默默修改游戏，而是首先组建起让团队全体成员参与进来的机制。他别具一格的做法让我很受震撼。",
        "困难时刻，他像空降部队一样加入团队。他当然可以发挥自己的能力，宣称没有问题，让大家放心。然而，岩田先生救团队于危急之境的方法，并不是仅凭他的一己之力。他首先为团队全体整顿好环境，让每个人都能接触到游戏的内容。因此，人人都觉得“只要努力就能成功”。每个人都认为自己应该全力以赴，这样一来，大家就能兴致勃勃地投入工作了（笑）。",
        "岩田先生还有一句名言：“程序员不能说不。”日后这句话被断章取义，给程序员带来了负担。那当然不是岩田先生的原意。他说这句话的语境是：“糸井先生只需尽情构想，思考怎样去实现是我们的工作。”对此我心怀感激。",
        "此外，对于新创意，岩田先生总是给予积极的回应。每当我像个不负责任的大叔一样，提出一些有趣而异想天开的创意时，他总是很开心的样子，说着“没想到你会这么做”，“要做到这种程度吗”。有时候他会说，“那么，也可以这样做”，并反馈给我新的提案。因此像“地下帝国”的演出，还有“章鱼消除机”的发明，无论是提出创意的一方，还是实际制作的一方，都很享受其中。",
        "我记得岩田先生还说过：“计算机能做到的事，就交给计算机去做。”对于平时就熟练操作电脑的人来说，这句话听起来理所当然，对我而言却很新鲜。“人想做的是只有人类才能完成的事情”，这句话岩田先生经常挂在嘴边，我也非常认同。岩田先生大概比任何人都更了解计算机，但是他不认为熟练运用计算机就能高人一等。正因为计算机是方便的工具，才更让人对只有人类才能完成的事情抱有兴趣。",
        "回忆起来，《地球冒险2》开发期间，我并未与岩田先生深入探讨过游戏的具体内容。剧本和对话已经完成，岩田先生做的是将这些已有的素材重新组合。每当我提出“想实现这种效果”的时候，岩田先生就会说“那么这样如何”，总是报以接纳的态度。我从来没有听他发表过“必须这么做”或“游戏本该如此”这样的言论。当然也有可能是我忘记了（笑）。我们会一起探讨的是更本质的问题，比如人们会对哪些东西产生兴趣。",
        "开发工作经常持续到很晚，但岩田先生不得不回山梨去，所以我时常在新宿车站南口为他送行。通常他会乘特急梓号列车，并说道：“梓号会晃来晃去呢！”他混在登山客之中，归程也是一副开心的模样。"
      ]

function rpnCalc(stack, op) {
  const s = [...(stack || [])];
  if (typeof op === 'number') {
    s.push(op);
    return { stack: s, msg: `将数值 [${op}] 压入计算栈顶` };
  }
  if (['+', '-', '*', '/'].includes(op)) {
    if (s.length < 2) return { stack: s, error: '栈内至少需要两个数值才能执行运算' };
    const b = s.pop();
    const a = s.pop();
    let res = 0;
    if (op === '+') res = a + b;
    else if (op === '-') res = a - b;
    else if (op === '*') res = a * b;
    else if (op === '/') res = b !== 0 ? Math.round((a / b) * 100) / 100 : 0;
    s.push(res);
    return { stack: s, msg: `出栈运算：${a} ${op} ${b} = ${res}，结果已重新入栈` };
  }
  if (op === 'clear') return { stack: [], msg: '计算栈已重置' };
  return { stack: s, error: '未知指令' };
}

function evalBottleneck(pipeline, action) {
  const keys = Object.keys(pipeline);
  const maxKey = keys.reduce((a, b) => pipeline[a] > pipeline[b] ? a : b);
  
  if (action === maxKey) {
    return {
      success: true,
      msg: `✓ 准确定位瓶颈环节 [${action === 'logic' ? '核心逻辑' : action}]！正如岩田社长所言，疏通最狭窄之处后，全产线积压瞬间化解。`,
      nextPipeline: { ...pipeline, [action]: Math.max(3, pipeline[action] - 6) }
    };
  } else {
    return {
      success: false,
      msg: `⚠️ 盲目优化 [${action === 'concept' ? '策划案' : action}] 无法提升流速！它不是当前的阻塞瓶颈，再怎么拓宽也不会改变全局吞吐量。`,
      nextPipeline: pipeline
    };
  }
}

        </div>

        <div class="situation-card ${res.rdStatus.level}">
          <div class="card-title">${res.rdStatus.title}</div>
          <p>${res.rdStatus.desc}</p>
        </div>
      </div>

      <div class="situation-summary ${res.isBalanced ? 'balanced' : 'unbalanced'}">
        <span class="summary-icon">${res.isBalanced ? '✓' : 'ℹ'}</span>
        <span>${res.summary}</span>
      </div>
    </div>
  `;
}

function renderRpnWidget() {
  const stack = store.simState.rpn?.stack || [];
  const msg = store.simState.rpn?.msg || '操作提示：依次点击 [1] -> [2] -> [＋]，体验没有等号键的逆波兰逻辑！';

  return `
    <div class="inline-widget rpn-widget">
      <div class="widget-badge">✦ 原文情境体验 · 岩田社长少年时代的 HP 逆波兰台式机</div>
      <div class="widget-lead">
        “如果要计算 1 加 2，得先按 1 再按 ENTER，接着按 2，最后按 ＋。”
      </div>
      <div class="rpn-display-box">
        <div class="stack-view">当前运算栈（后进先出）：[ ${stack.length ? stack.join(' , ') : '空'} ]</div>
        <div class="rpn-buttons">
          <button class="btn-rpn-key" data-rpn="1">输入 1</button>
          <button class="btn-rpn-key" data-rpn="2">输入 2</button>
          <button class="btn-rpn-key" data-rpn="3">输入 3</button>
          <button class="btn-rpn-key op" data-rpn="+">＋ (相加)</button>
          <button class="btn-rpn-key op" data-rpn="*">× (相乘)</button>
          <button class="btn-rpn-key reset" data-rpn="clear">重置栈</button>
        </div>
        <div class="rpn-status-text">${escapeHtml(msg)}</div>
      </div>
    </div>
  `;
}

function renderBottleneckWidget() {
  const pipe = store.simState.pipe || { concept: 4, art: 6, logic: 16, qa: 3 };
  const log = store.simState.pipeLog || '点击下方积压最严重的瓶颈环节，尝试对其进行优化：';

  return `
    <div class="inline-widget pipe-widget">
      <div class="widget-badge">✦ 原文机制沙盒 · 找出全线流速瓶颈</div>
      <div class="widget-lead">
        “要想让整体顺畅运转，就必须首先找到这个最狭窄的地方。只把注意力放在瓶颈以外，再拓宽也改变不了全局。”
      </div>
      <div class="pipe-cards-flex">
        ${Object.entries(pipe).map(([k, v]) => `
          <button class="pipe-item-btn ${v >= 10 ? 'choke' : ''}" data-pipe="${k}">
            <span class="p-name">${k === 'concept' ? '策划设定' : k === 'art' ? '原画资源' : k === 'logic' ? '核心代码逻辑' : '质检回归'}</span>
            <strong class="p-load">排队积压: ${v}</strong>
            <span class="p-tip">${v >= 10 ? '🚨 最狭窄瓶颈！' : '流动顺畅'}</span>
          </button>
        `).join('')}
      </div>
      <div class="pipe-feedback-bar">${escapeHtml(log)}</div>
    </div>
  `;
}

function renderProgrammerWidget() {
  const mode = store.simState.programmerMode || 'iwata';
  const res = evalProgrammerResponse(mode);

  return `
    <div class="inline-widget prog-widget">
      <div class="widget-badge">✦ 原文思辨沙盒 · “程序员不能说不”的真正含义</div>
      <div class="widget-lead">
        当策划或伙伴提出一个在现有代码结构下极其棘手的新需求时，不同的回应方式会引发何种连锁反应？
      </div>

      <div class="mode-select-row">
        <button class="btn-mode ${mode === 'reject' ? 'selected' : ''}" data-prog-mode="reject">① 直接拒绝：“在技术上绝不可能”</button>
        <button class="btn-mode ${mode === 'blind-agree' ? 'selected' : ''}" data-prog-mode="blind-agree">② 盲目应承：“没问题我硬写”</button>
        <button class="btn-mode ${mode === 'iwata' ? 'selected' : ''}" data-prog-mode="iwata">③ 岩田式回应：重构底层与边界条件</button>
      </div>

      <div class="prog-feedback-box ${res.isIwataWay ? 'iwata-way' : 'flawed'}">
        <h4>${res.title}</h4>
        <p>${res.feedback}</p>
      </div>
    </div>
  `;
}

function renderMother2Widget() {
  const choice = store.simState.mother2Choice || 'rewrite';
  const res = evalMother2Choice(choice);

  return `
    <div class="inline-widget mother2-widget">
      <div class="widget-badge">✦ 历史决断沙盒 · 重做《地球冒险2》的两个方法</div>
      <div class="widget-lead">
        糸井重里团队开发《地球冒险2》陷入泥潭工期停滞。岩田聪亲赴现场视察全部代码后，给出了震撼业界的两种选择：
      </div>

      <div class="choice-tabs">
        <button class="choice-tab ${choice === 'patch' ? 'active' : ''}" data-mother2="patch">方案 A：顺着现状打补丁继续修</button>
        <button class="choice-tab ${choice === 'rewrite' ? 'active' : ''}" data-mother2="rewrite">方案 B：推倒重来，由岩田聪彻底重写底层</button>
      </div>

      <div class="mother2-report-card ${res.isHistorical ? 'historical-win' : 'delay-trap'}">
        <div class="report-metrics">
          <div>预计工期：<strong>${res.time}</strong></div>
          <div>技术风险：<strong>${res.risk}</strong></div>
          <div>团队士气：<strong>${res.morale}</strong></div>
        </div>
        <p class="report-desc">${res.result}</p>
      </div>
    </div>
  `;
}

function renderConsoleStrategyWidget() {
  const strat = store.simState.consoleStrategy || 'blue-ocean';
  const res = evalConsoleStrategy(strat);

  return `
    <div class="inline-widget console-widget">
      <div class="widget-badge">✦ 商业哲学沙盒 · 站在既有延长线上的可怕性</div>
      <div class="widget-lead">
        主机世代更迭时，竞争对手纷纷加码算力与逼真画质。任天堂应如何抉择？
      </div>

      <div class="choice-tabs">
        <button class="choice-tab ${strat === 'spec-war' ? 'active' : ''}" data-console="spec-war">继续性能延长线（追逐更高算力与极致画面）</button>
        <button class="choice-tab ${strat === 'blue-ocean' ? 'active' : ''}" data-console="blue-ocean">打破延长线：NDS 双屏触控 & Wii 体感蓝海</button>
      </div>

      <div class="console-report-card ${res.isBlueOcean ? 'historical-win' : 'spec-trap'}">
        <div class="report-metrics">
          <div>开发成本：<strong>${res.cost}</strong></div>
          <div>玩家群体：<strong>${res.market}</strong></div>
        </div>
        <p class="report-desc">${res.feedback}</p>
      </div>
    </div>
  `;
}

function bindEvents() {
  // Chapter Switch
  document.querySelector('#chapter-select')?.addEventListener('change', e => {
    store.currentChapter = Number(e.target.value);
    store.currentSection = 0;
    save();
    render();
  });

  // Section Switch
  document.querySelectorAll('.toc-item').forEach(btn => {
    btn.addEventListener('click', () => {
      store.currentSection = Number(btn.getAttribute('data-sec'));
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  // Font resize
  document.querySelector('#btn-font-inc')?.addEventListener('click', () => {
    store.fontSize = Math.min(26, (store.fontSize || 18) + 1);
    save();
    render();
  });
  document.querySelector('#btn-font-dec')?.addEventListener('click', () => {
    store.fontSize = Math.max(14, (store.fontSize || 18) - 1);
    save();
    render();
  });

  // Debt slider live feedback
  document.querySelectorAll('[data-alloc]').forEach(slider => {
    slider.addEventListener('input', e => {
      const key = e.target.getAttribute('data-alloc');
      store.simState.debt ||= { salary: 42, debt: 38, rd: 20 };
      store.simState.debt[key] = Number(e.target.value);
      save();
      const container = document.querySelector('#debt-interactive-box');
      if (container) {
        container.outerHTML = renderDebtWidget();
        bindEvents();
      }
    });
  });

  // RPN actions
  document.querySelectorAll('[data-rpn]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.getAttribute('data-rpn');
      const op = ['+', '-', '*', '/', 'clear'].includes(val) ? val : Number(val);
      const curStack = store.simState.rpn?.stack || [];
      const res = rpnCalc(curStack, op);
      store.simState.rpn = { stack: res.stack, msg: res.msg || res.error };
      save();
      render();
    });
  });

  // Pipe actions
  document.querySelectorAll('[data-pipe]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-pipe');
      const pipe = store.simState.pipe || { concept: 4, art: 6, logic: 16, qa: 3 };
      const res = evalBottleneck(pipe, key);
      store.simState.pipe = res.nextPipeline;
      store.simState.pipeLog = res.msg;
      save();
      render();
    });
  });

  // Programmer response buttons
  document.querySelectorAll('[data-prog-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      store.simState.programmerMode = btn.getAttribute('data-prog-mode');
      save();
      render();
    });
  });

  // Mother 2 choices
  document.querySelectorAll('[data-mother2]').forEach(btn => {
    btn.addEventListener('click', () => {
      store.simState.mother2Choice = btn.getAttribute('data-mother2');
      save();
      render();
    });
  });

  // Console choices
  document.querySelectorAll('[data-console]').forEach(btn => {
    btn.addEventListener('click', () => {
      store.simState.consoleStrategy = btn.getAttribute('data-console');
      save();
      render();
    });
  });

  // Notes and done buttons
  const sections = iwataChapters[store.currentChapter] || [];
  const curSec = sections[store.currentSection];

  const noteInput = document.querySelector('#section-note');
  noteInput?.addEventListener('input', e => {
    if (curSec) store.notes[curSec.id] = e.target.value;
    save();
  });

  document.querySelector('#btn-done')?.addEventListener('click', () => {
    if (curSec) {
      store.completed[curSec.id] = true;
      save();
      render();
    }
  });

  document.querySelector('#btn-next')?.addEventListener('click', () => {
    if (store.currentSection < sections.length - 1) {
      store.currentSection++;
      save();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
}

function escapeHtml(text) {
  return String(text || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

render();

</script>
</body>
</html>
