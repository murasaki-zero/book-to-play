<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>岩田先生如是说 · 原文精读与思辨室</title>
  <link rel="icon" type="image/svg+xml" href="../../chapter-one/dist/assets/favicon.svg">
  <style>
    :root {
      --bg: #111720;
      --bg-panel: #182230;
      --bg-panel-sub: #131c27;
      --paper: #1c2736;
      --ink: #e6eef7;
      --ink-dim: #9bb0c4;
      --ink-muted: #62778c;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --accent-orange: #f59e0b;
      --accent-blue: #38bdf8;
      --card-border: rgba(148, 167, 184, 0.14);
      --font-serif: "Songti SC", "SimSun", "STSong", "FangSong", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scrollbar-width: thin;
      scrollbar-color: var(--accent-blue) var(--bg);
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.8;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; color: inherit; }

    .reader-shell {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* Sidebar */
    .reader-sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--card-border);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-top {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 18px;
    }
    .nav-back-shelf {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-blue);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 14px;
      padding: 4px 8px;
      margin-left: -8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .nav-back-shelf:hover { background: rgba(56, 189, 248, 0.12); }
    .reader-book-identity h2 {
      font-family: var(--font-serif);
      font-size: 22px;
      color: #fff;
      font-weight: 600;
      margin: 4px 0 2px;
    }
    .reader-book-identity p {
      font-size: 12px;
      color: var(--ink-dim);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-family: var(--font-mono);
      display: block;
    }

    .chapter-switcher {
      margin-bottom: 16px;
    }
    .chapter-switcher label {
      display: block;
      font-size: 12px;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }
    .chapter-switcher select {
      width: 100%;
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .section-toc-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }
    .toc-item {
      text-align: left;
      background: transparent;
      border: 0;
      padding: 9px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--ink-dim);
      cursor: pointer;
      transition: all 0.15s;
    }
    .toc-item:hover {
      background: var(--bg-panel-sub);
      color: var(--ink);
    }
    .toc-item.active {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-weight: 500;
    }
    .toc-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }
    .toc-item.done .toc-num {
      background: #15803d;
      color: #fff;
      border-color: #15803d;
    }
    .toc-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-foot {
      padding-top: 18px;
      border-top: 1px solid var(--card-border);
      margin-top: 12px;
    }
    .font-resizer {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-muted);
      margin-bottom: 8px;
    }
    .btn-font {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-font:hover { color: #fff; border-color: var(--accent-blue); }
    .reading-stats {
      font-size: 12px;
      color: var(--ink-muted);
      font-family: var(--font-mono);
    }

    /* Main Stage */
    .reader-stage {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .reader-topbar {
      height: 64px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 44px;
    }
    .reader-breadcrumb {
      font-size: 13px;
      color: var(--ink-muted);
      display: flex;
      gap: 8px;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reader-breadcrumb strong { color: var(--ink); font-weight: 500; }
    .curr-sec-title { color: #fff; }
    .read-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    /* Reading Paper */
    .reader-paper {
      max-width: 820px;
      width: 100%;
      margin: 44px auto 100px;
      padding: 0 36px;
    }
    .section-heading {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 22px;
    }
    .section-chapter-tag {
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--accent-blue);
      letter-spacing: 0.05em;
    }
    .section-main-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 3vw, 38px);
      color: #fff;
      font-weight: 600;
      line-height: 1.35;
      margin-top: 6px;
    }

    /* Paragraphs */
    .book-paragraph {
      font-size: var(--base-font-size, 18px);
      line-height: 2.05;
      color: var(--ink);
      margin-bottom: 24px;
      text-align: justify;
      text-justify: inter-ideograph;
    }

    /* Inline Contextual Widgets */
    .inline-widget {
      margin: 36px 0;
      padding: 26px 28px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--bg-panel);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .widget-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent-orange);
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .widget-lead {
      font-size: 14px;
      color: var(--ink-dim);
      margin-bottom: 20px;
      line-height: 1.7;
    }

    /* Sliders Board */
    .sliders-board {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 22px;
      background: var(--bg-panel-sub);
      padding: 18px 20px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slider-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
    .slider-val {
      font-family: var(--font-mono);
      color: var(--accent-blue);
      font-size: 15px;
    }
    .slider-track {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Situation Cards Grid */
    .situation-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .situation-card {
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--bg-panel-sub);
      transition: all 0.2s ease;
    }
    .situation-card.good {
      border-color: rgba(34, 197, 94, 0.4);
      background: rgba(34, 197, 94, 0.08);
    }
    .situation-card.warning {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
    }
    .situation-card.danger {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.08);
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .situation-card.good .card-title { color: #4ade80; }
    .situation-card.warning .card-title { color: #fbbf24; }
    .situation-card.danger .card-title { color: #f87171; }
    .situation-card p {
      font-size: 12px;
      line-height: 1.65;
      color: var(--ink-dim);
      margin: 0;
    }

    .situation-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .situation-summary.balanced {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }
    .situation-summary.unbalanced {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
    }

    /* RPN widget */
    .rpn-display-box {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 18px;
    }
    .stack-view {
      font-family: var(--font-mono);
      font-size: 16px;
      color: #4ade80;
      background: #0b1118;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .rpn-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .btn-rpn-key {
      background: var(--bg-panel);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-rpn-key:hover { border-color: var(--accent-blue); color: #fff; }
    .btn-rpn-key.op { border-color: rgba(56, 189, 248, 0.4); color: var(--accent-blue); }
    .btn-rpn-key.reset { border-color: rgba(239, 68, 68, 0.4); color: #f87171; }
    .rpn-status-text {
      font-size: 12.5px;
      color: var(--ink-dim);
    }

    /* Pipe Widget */
    .pipe-cards-flex {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .pipe-item-btn {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      padding: 14px 10px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.15s;
    }
    .pipe-item-btn:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
    .pipe-item-btn.choke {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }
    .p-name { font-size: 13px; font-weight: 500; }
    .p-load { font-size: 12px; font-family: var(--font-mono); color: var(--accent-blue); }
    .p-tip { font-size: 11px; color: var(--ink-muted); }
    .pipe-feedback-bar {
      font-size: 13px;
      color: var(--accent-blue);
      background: var(--bg-panel-sub);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    /* Programmer, Mother2 & Console Strategy Widgets */
    .mode-select-row, .choice-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .btn-mode, .choice-tab {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      color: var(--ink-dim);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-mode:hover, .choice-tab:hover {
      border-color: var(--accent-blue);
      color: #fff;
    }
    .btn-mode.selected, .choice-tab.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-blue);
      color: #fff;
      font-weight: 500;
    }

    .prog-feedback-box, .mother2-report-card, .console-report-card {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 18px;
    }
    .prog-feedback-box.iwata-way, .mother2-report-card.historical-win, .console-report-card.historical-win {
      border-color: rgba(74, 222, 128, 0.4);
      background: rgba(34, 197, 94, 0.05);
    }
    .prog-feedback-box.flawed, .mother2-report-card.delay-trap, .console-report-card.spec-trap {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.05);
    }
    .prog-feedback-box h4 {
      margin: 0 0 8px 0;
      font-size: 15px;
      font-weight: 600;
    }
    .prog-feedback-box.iwata-way h4 { color: #4ade80; }
    .prog-feedback-box.flawed h4 { color: #f87171; }
    .prog-feedback-box p, .report-desc {
      font-size: 13px;
      line-height: 1.7;
      color: var(--ink-dim);
      margin: 0;
    }

    .report-metrics {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      font-size: 13px;
      color: var(--ink-muted);
    }
    .report-metrics strong {
      color: #fff;
    }

    /* Era Capsule Box */
    .era-capsule-box {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 36px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .era-capsule-header {
      margin-bottom: 12px;
    }
    .era-tag {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--accent-blue);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .era-title {
      font-family: var(--font-serif);
      font-size: 19px;
      color: #fff;
      font-weight: 600;
      margin-top: 4px;
    }
    .era-context {
      font-size: 13.5px;
      line-height: 1.75;
      color: var(--ink-dim);
      margin: 0 0 16px 0;
    }
    .era-figures-row {
      border-top: 1px dashed var(--card-border);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .era-figures-label {
      font-size: 12px;
      color: var(--ink-muted);
      font-family: var(--font-mono);
    }
    .era-figures-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .figure-chip {
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12.5px;
      cursor: help;
      transition: all 0.15s ease;
    }
    .figure-chip:hover {
      border-color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.1);
    }
    .figure-chip strong {
      color: #fff;
      margin-right: 6px;
    }
    .figure-chip span {
      color: var(--ink-muted);
      font-size: 11.5px;
    }

    /* Trivia & Anecdotes Box */
    .trivia-section-box {
      margin-top: 40px;
      background: var(--bg-panel-sub);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px 24px;
    }
    .trivia-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .trivia-badge {
      font-size: 14px;
      font-weight: 600;
      color: #fbbf24;
      font-family: var(--font-mono);
    }
    .trivia-hint {
      font-size: 12px;
      color: var(--ink-muted);
    }
    .trivia-cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .trivia-card {
      background: var(--bg-panel);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
    }
    .trivia-card h4 {
      font-size: 14px;
      color: #fff;
      margin: 0 0 8px 0;
      font-weight: 600;
    }
    .trivia-card p {
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--ink-dim);
      margin: 0;
    }
    @media (max-width: 768px) {
      .trivia-cards-grid { grid-template-columns: 1fr; }
    }

    /* Reader Reflection */
    .section-foot {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--card-border);
    }
    .reader-reflection-box textarea {
      width: 100%;
      min-height: 110px;
      background: var(--bg-panel);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.7;
      margin-top: 8px;
    }
    .section-nav-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn-mark-done {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      border: 1px solid rgba(74, 222, 128, 0.4);
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-mark-done:hover { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
    .btn-next-sec {
      background: var(--bg-panel);
      border: 1px solid var(--card-border);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      color: var(--accent-blue);
      cursor: pointer;
    }
    .btn-next-sec:hover { border-color: var(--accent-blue); }

    @media (max-width: 860px) {
      .reader-shell { grid-template-columns: 1fr; }
      .reader-sidebar { height: auto; position: static; }
      .reader-paper { padding: 0 18px; margin: 24px auto 60px; }
      .reader-topbar { padding: 0 18px; }
      .situation-grid { grid-template-columns: 1fr; }
      .pipe-cards-flex { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="iwata-app.js"></script>
</body>
</html>
